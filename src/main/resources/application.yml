spring:
  application:
    name: spring-lab-02
  thymeleaf:
    cache: false
  messages:
    fallback-to-system-locale: false
  datasource:
    url: jdbc:h2:mem:txlab;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration



server:
  port: 8080

app:
  owner: Erkin Aruzhan
  group: 2405-IS
  date-pattern: "yyyy-MM-dd HH:mm:ss"
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true
  notification:
    channels:
      telegram: "@aruzhan_alerts"
      email: "alerts@iitu.kz"
    quiet-hours: "23:00-07:00"

logging:
  level:
    org.example: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
  endpoint:
    env:
      show-values: always
